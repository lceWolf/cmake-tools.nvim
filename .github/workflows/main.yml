name: Main
on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
jobs:
  format:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repo
        uses: actions/checkout@v2

      - name: Stylua
        uses: JohnnyMorganz/stylua-action@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v0.17.1 # NOTE: we recommend pinning to a specific version in case of formatting changes
          args: --check -f ./stylua.toml .
  tests:
    name: Tests (nvim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.10.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        # Unpack on the same filesystem as $HOME, see rhysd/action-setup-vim#80
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Run tests
        run: |
          nvim --version
          make test
